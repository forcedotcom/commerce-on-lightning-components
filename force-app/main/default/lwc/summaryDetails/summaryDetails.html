<template lwc:render-mode="light">
    <div
        class="summary slds-p-horizontal_medium"
        role="region"
        aria-label={summaryAriaLabel}>
        <div class={headerClasses}>
            <div class="slds-col slds-no-space">
                <template if:true={isCartSummary}>
                    <div class="confirmation-title cart-summary-title slds-p-top_small slds-p-bottom_small">
                        <h2>
                            <lightning-formatted-rich-text value={confirmationTitle}></lightning-formatted-rich-text>
                        </h2>
                    </div>
                </template>
                <template if:false={isCartSummary}>
                    <h2 class="confirmation-title slds-p-top_small slds-p-bottom_x-small">{confirmationTitle}</h2>
                </template>

                <button
                    class={clickableRowClasses}
                    onclick={handleToggleExpanded}
                    aria-label={toggleButtonAriaLabel}
                    aria-expanded={isExpanded}
                    aria-controls="summary-content">
                    <template if:true={isCartSummary}>
                        <lightning-formatted-rich-text
                            class="delivery-message slds-col slds-text-align_left"
                            value={cartSummaryBodyMessage}></lightning-formatted-rich-text>
                    </template>
                    <template if:false={isCartSummary}>
                        <p class="delivery-message slds-col slds-m-around_none slds-text-align_left">
                            {summaryMessage}
                        </p>
                    </template>

                    <div
                        class="caret-container slds-col slds-no-flex slds-p-horizontal_small"
                        aria-hidden="true">
                        <lightning-icon
                            icon-name={caretIconName}
                            size="x-small"
                            class="caret-icon"></lightning-icon>
                    </div>
                </button>
            </div>
        </div>

        <div
            id="summary-content"
            class={expandableContentClasses}
            aria-live="polite">
            <template if:true={isExpanded}>
                <template if:false={isCartSummary}>
                    <template if:true={orderNumber}>
                        <div class="slds-p-bottom_medium">
                            <span class="order-id-label">{i18n.orderIdLabel}</span>
                            <span class="order-id-number slds-p-left_x-small">#{orderNumber}</span>
                        </div>
                    </template>
                </template>

                <div
                    class="slds-p-bottom_x-small"
                    role="list"
                    aria-label={itemsAriaLabel}>
                    <template
                        for:each={items}
                        for:item="item">
                        <div
                            key={item.name}
                            class="item slds-p-bottom_x-small slds-m-bottom_x-small">
                            <c-product-summary
                                item={item}
                                configuration={configuration}></c-product-summary>
                        </div>
                    </template>
                </div>

                <div
                    class={totalsClasses}
                    role="region"
                    aria-label={totalsAriaLabel}>
                    <div class="summary-row slds-p-bottom_xxx-small">
                        <span
                            class="summary-label"
                            id="subtotal-label">
                            {i18n.subtotalLabel}
                        </span>
                        <span
                            class="summary-value"
                            aria-labelledby="subtotal-label">
                            {subtotal}
                        </span>
                    </div>

                    <template if:true={hasCouponsDiscount}>
                        <div class="summary-row slds-p-bottom_xxx-small">
                            <span
                                class="summary-label"
                                id="coupons-discount-label">
                                {i18n.couponsDiscountLabel}
                            </span>
                            <span
                                class="summary-value"
                                aria-labelledby="coupons-discount-label">
                                {couponsDiscount}
                            </span>
                        </div>
                    </template>

                    <template if:true={hasPromotions}>
                        <div class="summary-row summary-row-promotions slds-p-bottom_xxx-small">
                            <div class="summary-row-promotions-content">
                                <span
                                    class="summary-label"
                                    id="promotions-label">
                                    {i18n.promotionsLabel}
                                </span>
                                <template if:true={hasOrderLevelPromotions}>
                                    <div
                                        class="order-promotions-pills"
                                        role="list"
                                        aria-label={i18n.promotionsLabel}>
                                        <template
                                            for:each={orderLevelPromotions}
                                            for:item="promo">
                                            <c-custom-pill
                                                key={promo.id}
                                                label={promo.text}
                                                variant="promotion"
                                                max-width="350px"></c-custom-pill>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <span
                                class="summary-value"
                                aria-labelledby="promotions-label">
                                {promotions}
                            </span>
                        </div>
                    </template>

                    <div class="summary-row slds-p-bottom_xxx-small">
                        <span
                            class="summary-label"
                            id="shipping-label">
                            {i18n.shippingLabel}
                        </span>
                        <span
                            class="summary-value"
                            aria-labelledby="shipping-label">
                            {shipping}
                        </span>
                    </div>

                    <template if:true={hasShippingDiscount}>
                        <div class="summary-row summary-row-promotions slds-p-bottom_xxx-small">
                            <div class="summary-row-promotions-content">
                                <span
                                    class="summary-label"
                                    id="shipping-discount-label">
                                    {i18n.shippingDiscountLabel}
                                </span>
                                <template if:true={hasShippingPromotionPills}>
                                    <div
                                        class="order-promotions-pills"
                                        role="list"
                                        aria-label={i18n.shippingDiscountLabel}>
                                        <template
                                            for:each={shippingPromotionPills}
                                            for:item="promo">
                                            <c-custom-pill
                                                key={promo.id}
                                                label={promo.text}
                                                variant="promotion"
                                                max-width="350px"></c-custom-pill>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <span
                                class="summary-value"
                                aria-labelledby="shipping-discount-label">
                                {shippingDiscount}
                            </span>
                        </div>
                    </template>

                    <div class="summary-row slds-p-bottom_x-small">
                        <span
                            class="summary-label"
                            id="taxes-label">
                            {i18n.taxesLabel}
                        </span>
                        <span
                            class="summary-value"
                            aria-labelledby="taxes-label">
                            {taxes}
                        </span>
                    </div>

                    <div class="summary-row total">
                        <span
                            class="total-label"
                            id="total-label">
                            {i18n.totalLabel}
                        </span>
                        <span
                            class="total-value"
                            aria-labelledby="total-label">
                            {total}
                        </span>
                    </div>

                    <template if:true={showOrderLevelCouponPills}>
                        <div
                            class="order-coupon-pills-wrapper slds-p-top_x-small"
                            role="list"
                            aria-label={orderLevelCouponPillsContainerAriaLabel}>
                            <template
                                for:each={orderLevelCouponPills}
                                for:item="coupon">
                                <c-custom-pill
                                    key={coupon.id}
                                    label={coupon.code}
                                    variant="coupon"
                                    disabled={coupon.isDisabled}></c-custom-pill>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Footer message section -->
        <template if:false={isCartSummary}>
            <div class="summary-footer slds-p-top_small slds-p-bottom_medium">
                <p class="footer-message">{i18n.footerMessage}</p>
            </div>
        </template>
    </div>
</template>
