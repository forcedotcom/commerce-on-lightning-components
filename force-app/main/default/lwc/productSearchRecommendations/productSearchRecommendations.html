<template lwc:render-mode="light">
    <!-- Main container with vertical grid layout -->
    <div
        lwc:if={hasRecommendations}
        class="slds-grid slds-grid_vertical">
        <!-- Products description section -->
        <div
            lwc:if={hasProductRecommendations}
            class="slds-col slds-p-top_small slds-p-horizontal_medium">
            <p class="products-description">{productsDescription}</p>
        </div>

        <!-- Product Carousel Section -->
        <!-- Uses the common carousel component to display product recommendations -->
        <div
            lwc:if={hasProductRecommendations}
            class="slds-col slds-p-top_xx-small slds-p-left_x-small">
            <c-common-carousel
                product-data={transformedProductData}
                configuration={configuration}
                display-mode="productSearchRecommendations"
                onproductselected={handleShowProduct}></c-common-carousel>
        </div>

        <!-- Categories Section -->
        <!-- Displays clickable category buttons for filtering -->
        <div
            lwc:if={hasCategoryRecommendations}
            class="slds-col slds-p-vertical_small slds-p-horizontal_medium">
            <p class="categories-description">{categoriesDescription}</p>
            <!-- Grid layout for category buttons -->
            <div class="slds-grid slds-wrap slds-m-top_small category-layout">
                <template
                    for:each={categoryData}
                    for:item="category">
                    <!-- Individual category button container -->
                    <div
                        class="slds-m-right_x-small slds-m-bottom_x-small"
                        key={category.id}>
                        <!-- Clickable category button with hover effects -->
                        <button
                            name={category.name}
                            data-id={category.id}
                            onclick={handleSelectCategory}
                            class="category-button">
                            {category.name}
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
