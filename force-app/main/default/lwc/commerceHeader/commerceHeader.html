<template lwc:render-mode="light">
    <!-- 
        Left section: Menu and dropdown
        - Three-dots menu trigger button with accessible icon
        - Dropdown with dynamic options and role="menu" for accessibility
        - Includes transcript request and end chat options
    -->
    <section class={menuClass}>
        <!-- Menu trigger button with accessible icon and title -->
        <button
            class="headerButton menuButton"
            title={labels.menu}
            aria-label={labels.menu}
            aria-haspopup="true"
            aria-expanded={isMenuOpen}
            aria-controls="menuOptions"
            onclick={onMenuButtonClick}>
            <lightning-icon
                icon-name="utility:threedots_vertical"
                alternative-text={labels.menu}
                size="small"></lightning-icon>
        </button>
        <!-- 
            Dropdown menu with accessibility attributes
            - role="menu" for screen readers
            - slds-nubbin_top-left for visual indicator
        -->
        <section
            id="menuOptions"
            class="optionsMenu slds-dropdown slds-dropdown_left slds-nubbin_top-left"
            role="menu"
            hidden={isMenuClosed}
            aria-hidden={isMenuClosed}>
            <ul class="slds-dropdown__list">
                <!-- Transcript request option (conditionally rendered) -->
                <li
                    lwc:if={isRequestTranscriptionEnabled}
                    class="slds-dropdown__item"
                    role="presentation">
                    <button
                        type="button"
                        class="slds-dropdown__item-action"
                        role="menuitem"
                        onclick={onRequestTranscriptClick}>
                        {labels.requestTranscript}
                    </button>
                </li>
                <!-- 
                    Dynamic menu options from chatbot
                    - Each option has unique key for rendering
                    - role="presentation" for list items
                    - role="menuitem" for buttons
                -->
                <template
                    for:each={chatbotOptionsMenu}
                    for:item="option">
                    <li
                        class="slds-dropdown__item"
                        role="presentation"
                        key={option.optionIdentifier}>
                        <button
                            class="slds-dropdown__item-action"
                            value={option.optionIdentifier}
                            role="menuitem"
                            onclick={onMenuOptionClick}>
                            {option.title}
                        </button>
                    </li>
                </template>
                <!-- End chat option with error styling -->
                <li
                    class="slds-dropdown__item"
                    role="presentation">
                    <button
                        class="slds-dropdown__item-action slds-text-color_error"
                        role="menuitem"
                        onclick={onEndChatClick}>
                        {labels.endChat}
                    </button>
                </li>
            </ul>
        </section>
    </section>

    <!-- 
        Center section: Brand identity
        - Logo image with alt text
        - Dynamic header text with truncation
    -->
    <div class="headerCenter">
        <img
            src={logoSrc}
            alt={labels.logoAlt}
            class="brand-logo" />
        <h2
            class="headerTitle"
            title={headerText}
            aria-live="polite">
            {headerText}
        </h2>
    </div>

    <!-- 
        Right section: Minimize button
        - Close icon with accessible alternative text
        - Title attribute for tooltip
    -->
    <button
        class="headerButton minimizeButton"
        title={labels.minimize}
        onclick={onMinimizeButtonClick}>
        <lightning-icon
            icon-name="utility:close"
            alternative-text={labels.minimizeAssistive}
            size="small"></lightning-icon>
    </button>
</template>
