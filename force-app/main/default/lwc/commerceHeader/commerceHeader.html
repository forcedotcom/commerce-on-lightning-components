<template lwc:render-mode="light">
    <!-- Menu section with dropdown -->
    <section class={menuClass}>
        <c-common-button
            class="headerButton menuButton"
            title={i18n.menu}
            assistive-text={i18n.menu}
            aria-haspopup="true"
            aria-expanded={isMenuOpen}
            aria-controls="menuOptions"
            onclick={onMenuButtonClick}
            tabindex="0">
            <lightning-icon
                icon-name="utility:threedots_vertical"
                alternative-text={i18n.menu}
                size="x-small"></lightning-icon>
        </c-common-button>
        <!-- Dropdown menu options -->
        <section
            id="menuOptions"
            class="optionsMenu slds-dropdown slds-dropdown_left slds-nubbin_top-left"
            role="menu"
            hidden={isMenuClosed}
            aria-hidden={isMenuClosed}>
            <ul class="slds-dropdown__list">
                <!-- Request transcript option -->
                <li
                    lwc:if={isRequestTranscriptionEnabled}
                    class="slds-dropdown__item">
                    <c-common-button
                        alignment="left"
                        class="slds-dropdown__item-action slds-p-horizontal_medium slds-p-vertical_x-small"
                        assistive-text={i18n.requestTranscript}
                        onclick={onRequestTranscriptClick}>
                        {i18n.requestTranscript}
                    </c-common-button>
                </li>
                <!-- Dynamic chatbot menu options -->
                <template
                    for:each={chatbotOptionsMenu}
                    for:item="option">
                    <li
                        class="slds-dropdown__item"
                        key={option.optionIdentifier}>
                        <c-common-button
                            alignment="left"
                            class="slds-dropdown__item-action slds-p-horizontal_medium slds-p-vertical_x-small"
                            data-option-id={option.optionIdentifier}
                            onclick={onMenuOptionClick}>
                            {option.title}
                        </c-common-button>
                    </li>
                </template>
                <!-- End chat option -->
                <li class="slds-dropdown__item">
                    <c-common-button
                        alignment="left"
                        class="slds-dropdown__item-action end-chat-button slds-p-horizontal_medium slds-p-vertical_x-small"
                        assistive-text={i18n.endChat}
                        onclick={onEndChatClick}>
                        {i18n.endChat}
                    </c-common-button>
                </li>
            </ul>
        </section>
    </section>
    <!-- Center header with logo and title -->
    <div class="headerCenter">
        <img
            src={logoSrc}
            alt={i18n.logoAlt}
            class="brand-logo" />
        <h2
            class="headerTitle"
            title={headerText}
            aria-live="polite">
            {headerText}
        </h2>
    </div>
    <!-- Minimize/close button -->
    <c-common-button
        class="headerButton minimizeButton"
        title={i18n.minimize}
        aria-label={i18n.minimize}
        onclick={onMinimizeButtonClick}
        tabindex="0">
        <lightning-icon
            icon-name="utility:close"
            alternative-text={i18n.minimizeAssistive}
            size="x-small"
            class="close-icon"></lightning-icon>
    </c-common-button>
</template>
