<template lwc:render-mode="light">
    <div
        class={generateMessageBubbleClassname}
        role="region"
        aria-label={ariaLabelConversationContent}
        aria-live="polite">
        <template lwc:if={isWelcomeMessage}>
            <div class={richTextClasses}>
                <lightning-formatted-rich-text
                    value={textContent}
                    aria-label={ariaLabelRichTextContent}></lightning-formatted-rich-text>
            </div>
            <template lwc:if={hasContextualData}>
                <c-conversational-context
                    contextual-data={dynamicComponentData.contextualData}
                    contextual-description={dynamicComponentData.contextualDescription}
                    onselectcontext={handleSelectContext}></c-conversational-context>
            </template>
        </template>
        <template lwc:elseif={isProductRecommendations}>
            <c-product-search-recommendations
                product-data={dynamicComponentData.productData}
                products-description={dynamicComponentData.productsDescription}
                category-data={dynamicComponentData.categoryData}
                categories-description={dynamicComponentData.categoriesDescription}
                show-more-products={dynamicComponentData.showMoreProducts}
                configuration={configuration}
                onaddtocart={handleAddToCart}
                onselectcategory={handleSelectCategory}
                onshowproduct={handleShowProduct}
                onshowmoreproducts={handleShowMoreProducts}></c-product-search-recommendations>
        </template>
        <template lwc:elseif={isProductDetails}>
            <c-product-details
                product={dynamicComponentData.product}
                entry-id={entryId}
                configuration={configuration}
                onaddtocart={handleAddToCart}
                onpayment={handlePayment}></c-product-details>
        </template>
        <template lwc:elseif={isCartSummary}>
            <c-cart-summary
                cart-summary={dynamicComponentData.cartSummary}
                entry-id={entryId}
                configuration={configuration}
                onpayment={handlePayment}></c-cart-summary>
        </template>
        <template lwc:elseif={isOrderConfirmation}>
            <c-summary-details
                details={dynamicComponentData.orderDetails}
                configuration={configuration}></c-summary-details>
        </template>
        <template lwc:elseif={isOrderCompleted}>
            <div class={richTextClasses}>
                <lightning-formatted-rich-text value={orderCompletedText}></lightning-formatted-rich-text>
            </div>
        </template>
        <template lwc:else>
            <div class={richTextClasses}>
                <lightning-formatted-rich-text
                    class="richTextContent"
                    value={textContent}
                    aria-label={ariaLabelRichTextContent}></lightning-formatted-rich-text>
            </div>
        </template>
    </div>
</template>
