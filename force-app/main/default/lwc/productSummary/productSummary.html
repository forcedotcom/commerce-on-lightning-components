<template lwc:render-mode="light">
    <div class="product-summary slds-grid slds-size_1-of-1">
        <div class="item-image slds-shrink-none">
            <img
                src={imageUrl}
                alt={name} />
        </div>
        <div class="item-content slds-col slds-grid">
            <!-- Left column: Main content -->
            <div class="item-details">
                <!-- Item name -->
                <h3 class="item-name slds-truncate">{name}</h3>

                <!-- Middle: Facets -->
                <div class="facets-container">
                    <template if:true={hasFacets}>
                        <ul class="item-variants slds-grid slds-grid_vertical">
                            <template
                                for:each={facets}
                                for:item="facet">
                                <li
                                    key={facet.type}
                                    class="facet-item">
                                    {facet.label}
                                    <span class="facet-value">{facet.value}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>

                <!-- Promotions: item level promotions -->
                <template if:true={hasItemPromotions}>
                    <div class="promotions-container">
                        <span class="promotions-label">{i18n.promotionsLabel}</span>
                        <ul
                            class="promotions-list"
                            role="list">
                            <template
                                for:each={itemPromotions}
                                for:item="promo">
                                <li key={promo.id}>
                                    <c-custom-pill
                                        label={promo.text}
                                        variant="promotion"
                                        max-width="350px"></c-custom-pill>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>

                <!-- Bottom: Quantity -->
                <div class="bottom-row">
                    <div class="item-quantity">
                        {i18n.quantityLabelText}
                        <span class="item-quantity-value">{quantity}</span>
                    </div>
                </div>

                <!-- Item-level coupon pills -->
                <template if:true={hasItemCoupons}>
                    <div class="item-coupons">
                        <template
                            for:each={itemCoupons}
                            for:item="coupon">
                            <c-custom-pill
                                key={coupon.id}
                                label={coupon.code}
                                variant="coupon"></c-custom-pill>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Right column: Price -->
            <div class="item-price-column">
                <div class="item-price">
                    <template if:true={hasStandardPrice}>
                        <div
                            class="price-container"
                            aria-label={priceAriaLabel}>
                            <del class="original-price">{formattedStandardPrice}</del>
                            <span class="current-price">{formattedPrice}</span>
                        </div>
                    </template>
                    <template if:false={hasStandardPrice}>
                        <span
                            aria-label={priceAriaLabel}
                            class="current-price">
                            {formattedPrice}
                        </span>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
